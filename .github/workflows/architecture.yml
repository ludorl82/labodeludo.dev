# Nightly regeneration of the live architecture view — STAGING ONLY for now.
#
# /architecture/live is gated behind SHOW_LIVE_ARCH (see the page's
# getStaticPaths): the prod deploy never sets it, so this workflow rebuilds
# the STAGING site with fresh data and publishes it to Cloudflare Pages —
# it does not touch prod or its S3 bucket at all.
#
# Clones the four PUBLIC sanitized snapshots — never the private repos; the
# sanitizers' fail-closed gates are the trust boundary — joins their
# topology.json files into src/data/architecture.json, stamps the drift-check
# state from Kuma's public status page, rebuilds and deploys. No commit: the
# freshly generated data only exists inside the build. The checked-in
# architecture.json is the fallback that keeps ordinary pushes building
# without network access to the snapshots; it goes stale by design and the
# page shows its generation date.
#
# A failed join (validation or allowlist) fails the run — a wrong diagram is
# worse than yesterday's.
name: Architecture

on:
  schedule:
    - cron: "15 9 * * *" # nightly, after the 07:1x drift checks have run
  workflow_dispatch:

jobs:
  regenerate:
    runs-on: [self-hosted, k3s]
    steps:
      - uses: actions/checkout@v4
        with:
          # the staging artifact is built from dev, like every staging deploy
          ref: dev
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Clone the public snapshots
        run: |
          mkdir -p /tmp/topology-snapshots
          for r in nixos-iac-public k3s-iac-public aws-iac-public cloudflare-iac-public; do
            rm -rf "/tmp/topology-snapshots/$r"
            git clone --depth 1 "https://github.com/ludorl82/$r.git" "/tmp/topology-snapshots/$r"
          done
      - name: Join topology
        run: python3 scripts/topology/join-topology.py /tmp/topology-snapshots
      - name: Stamp drift-check state
        # the runner is an in-cluster pod, so it reaches Kuma's public
        # status-page API service-to-service — no Access, no credentials.
        # fetch-drift fails open to "unknown" (never green) and exits 0.
        run: python3 scripts/topology/fetch-drift.py http://uptime-kuma.kuma.svc
      - run: npm ci
      - run: npm run build
        env:
          SHOW_LIVE_ARCH: "1"
      - name: Publish to Cloudflare Pages (staging)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # --branch=staging must match the Pages project's production branch —
        # same reasoning as deploy.yml: custom domains only serve production
        # deployments, and previews would escape the Access app.
        run: >-
          npx --yes wrangler@4 pages deploy dist
          --project-name=labodeludo-dev
          --branch=staging
          --commit-dirty=true
