# Nightly regeneration of the generated drawings, straight to production.
#
# Since 2026-08-08 the generated architecture and rack elevations are public,
# so their DATA has to stay fresh in prod: this rebuilds main with a freshly
# joined architecture.json and syncs it to S3. Component changes still travel
# the normal dev -> PR -> main path; only the data is refreshed here.
#
# Clones the four PUBLIC sanitized snapshots — never the private repos; the
# sanitizers' fail-closed gates are the trust boundary — joins their
# topology.json files into src/data/architecture.json, stamps the drift-check
# state from Kuma's public status page, rebuilds and deploys. No commit: the
# freshly generated data only exists inside the build. The checked-in
# architecture.json is the fallback for a build that cannot reach the
# snapshots; it goes stale by design and the page shows its generation date.
#
# Since 2026-08-09 deploy.yml's prod job runs the same three steps, so an
# ordinary push to main republishes fresh data too — it used to rebuild from
# the committed file and put a day-old drift badge back on the live page.
# This job is what still covers a day with no push at all; the two are
# deliberately redundant, and the nightly is the stricter of the pair.
#
# A failed join (validation or allowlist) fails the run — a wrong diagram is
# worse than yesterday's.
name: Architecture

on:
  # Triggered by Cronicle (event "Architecture Refresh (prod)", 05:30
  # America/Montreal) since 2026-08-09, not by a cron here.
  #
  # The cron this replaces claimed to run "after the 07:1x drift checks". It
  # did not: "15 9 * * *" is 09:15 UTC, which is 05:15 LOCAL — before the
  # drift checks and before the Nightly Diagram Sync. So every morning this
  # job sealed prod with the previous day's drift result and re-rendered
  # components the sync had not produced yet. Nothing was broken by it; the
  # order was simply backwards, and it stayed backwards because a UTC cron
  # here and a local-time schedule there were never going to agree by
  # themselves. Cronicle now runs the whole chain in order: drift checks
  # 04:30-04:40, sync 04:45, this at 05:30, done well before 06:00.
  #
  # The Kuma heartbeat below is unchanged and still absence-shaped, so it now
  # also covers "Cronicle never fired".
  workflow_dispatch:

jobs:
  regenerate:
    runs-on: [self-hosted, k3s]
    steps:
      - uses: actions/checkout@v4
        with:
          # production content comes from main — never from dev, or a night
          # would publish unmerged work
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # fail-on-join-error, unlike the deploy jobs: this workflow exists ONLY
      # to refresh this data, so a failed join leaves it nothing to publish —
      # better to go red and let the absence-shaped Kuma monitor say so than
      # to re-ship yesterday's file as if it were tonight's.
      - uses: ./.github/actions/derive-architecture
        with:
          fail-on-join-error: "true"
      - run: npm ci
      - run: npm run build
        env:
          SHOW_LIVE_ARCH: "1"
      - name: Deploy to prod
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.LABODELUDO_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.LABODELUDO_S3_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
        run: aws s3 sync dist/ s3://labodeludo.dev/ --delete
      - name: Kuma heartbeat
        # push monitor "architecture-nightly" — fires on ABSENCE,
        # which also covers GitHub silently disabling the cron after 60 idle
        # days. The runner is in-cluster, so the URL is the internal Service.
        if: always()
        run: >-
          curl -fsS -m 10
          "${{ secrets.KUMA_PUSH_URL_ARCHITECTURE }}?status=${{ job.status == 'success' && 'up' || 'down' }}&msg=${{ job.status }}"
