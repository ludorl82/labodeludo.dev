name: Deploy

on:
  push:

jobs:
  # Staging publishes to Cloudflare Pages (project `labodeludo-dev`, custom
  # domain dev.labodeludo.dev). It used to `kubectl cp` a build into an nginx
  # pod backed by the cluster's only RWX NFS claim; static content needed
  # neither the volume nor the pod, so both are gone.
  #
  # It then ran on a GitHub-hosted runner for a while, because nothing here
  # touched k3s: a public repo gets those minutes free, and staging could
  # deploy while the cluster was down. That came back to bite on 2026-08-17 —
  # dev.labodeludo.dev was serving an architecture diagram generated
  # 2026-08-08 while prod served that morning's. Only deploy-prod re-derived
  # the data, so staging rendered the CHECKED-IN architecture.json and lagged
  # by days. Backwards, too: /architecture/live was built staging-first, yet
  # staging was the one environment that could not refresh it.
  #
  # The derive step cannot run on a hosted runner: fetch-drift.py dials
  # http://uptime-kuma.kuma.svc, an in-cluster Service. Kuma's public twin is
  # behind Cloudflare Access, which is exactly why the stamping was put on an
  # in-cluster runner with no credentials. So staging runs here now, and
  # deliberately trades the free minutes and the deploy-while-cluster-is-down
  # property for a preview that tells the truth.
  deploy-staging:
    if: github.ref != 'refs/heads/main'
    runs-on: [self-hosted, k3s]
    # One runner, shared with deploy-prod and the nightly Architecture
    # workflow, and this job fires on EVERY non-main push — including the
    # nightly sync's pushes to dev. Superseded staging builds are cancelled
    # rather than queued behind each other; only the newest preview is worth
    # anything. Job-level on purpose: at workflow level this would also cancel
    # prod deploys, which must never be interrupted.
    concurrency:
      group: staging-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      # The same fresh data and the same drift stamp as prod — that is what a
      # preview is for. Join failures are non-fatal (the action's default).
      - uses: ./.github/actions/derive-architecture
      # SHOW_LIVE_ARCH: /architecture/live is staging-only for now — its
      # getStaticPaths emits the page only when this is set, so the prod
      # job below builds the same tree without it.
      - run: npm run build
        env:
          SHOW_LIVE_ARCH: "1"
      - name: Publish to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        # --branch=staging is deliberate and must match the Pages project's
        # production branch. Two reasons, both about not leaking the site:
        # a custom domain only ever serves the production deployment, so any
        # other value would leave dev.labodeludo.dev frozen; and a non-production
        # branch creates a *preview* deployment at its own <hash>.pages.dev URL,
        # which the Access app on dev.labodeludo.dev does not cover. Pinning the
        # value means previews are never created at all. It is the Pages branch,
        # not the git branch — every non-main push lands here, same as the old
        # single staging container.
        run: >-
          npx --yes wrangler@4 pages deploy dist
          --project-name=labodeludo-dev
          --branch=staging
          --commit-dirty=true

  deploy-prod:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, k3s]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      # Every prod deploy re-derives the architecture data and re-stamps the
      # drift badge, for the same reason the nightly Architecture workflow
      # does it: that workflow never commits its result, so before this
      # existed the next ordinary push to main rebuilt from the CHECKED-IN
      # architecture.json and s3-synced a day-old `verified` block over the
      # fresh one. On 2026-08-09 the nightly ran at 09:56Z and a push at
      # 10:44Z put a green badge dated 2026-08-08 09:24 UTC back on the live
      # page — precisely the "stale green" fetch-drift.py's own docstring
      # says this file must never tell. Freshness is now a property of every
      # deploy instead of a race between two of them.
      # Join failures are non-fatal here (the action's default), unlike in
      # architecture.yml: that workflow exists only to refresh this data, so a
      # failed join means it has no reason to continue, while this one
      # publishes the whole site and a briefly unjoinable snapshot repo must
      # not block shipping a blog post.
      - uses: ./.github/actions/derive-architecture
      # SHOW_LIVE_ARCH is on in production since 2026-08-08. The generated
      # architecture and rack drawings are no longer a preview: they carry
      # their own generation date and drift badge, so they say how fresh
      # they are instead of pretending. Setting this to "0" hides both
      # again without touching a page.
      - run: npm run build
        env:
          SHOW_LIVE_ARCH: "1"
      - env:
          AWS_ACCESS_KEY_ID: ${{ secrets.LABODELUDO_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.LABODELUDO_S3_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
        run: aws s3 sync dist/ s3://labodeludo.dev/ --delete
      - env:
          AWS_ACCESS_KEY_ID: ${{ secrets.LABODELUDO_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.LABODELUDO_S3_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
        run: bash scripts/redirect-old-urls.sh
