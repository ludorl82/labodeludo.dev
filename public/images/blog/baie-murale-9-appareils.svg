<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 580" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="Schéma de la baie murale, de haut en bas : panneau de raccordement, commutateur, deux onduleurs, panneau de raccordement, tiroir des deux Pi, puis deux étages de petits boîtiers ; trois appareils hors baie">
