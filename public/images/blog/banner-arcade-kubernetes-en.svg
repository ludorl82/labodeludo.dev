<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 320" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="Illustration: a gaming tower named 'the Cabinet' that hosts two gaming stations and also serves as a Kubernetes node; when a station starts, the pods leave the Cabinet and relocate to the rest of the cluster"><defs><linearGradient id="bgaken" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#2a1f3d"></stop><stop offset="100%" stop-color="#1f3f6e"></stop></linearGradient><marker id="arrowaken" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ffb3ea"></path></marker></defs><rect x="0" y="0" width="1024" height="320" fill="url(#bgaken)"></rect><g fill="#ffffff" opacity="0.05"><ellipse cx="170" cy="58" rx="140" ry="40"></ellipse><ellipse cx="880" cy="66" rx="150" ry="42"></ellipse></g><text x="512" y="46" text-anchor="middle" font-size="26" fill="#ffffff" font-weight="bold">An arcade cabinet on a Kubernetes node</text>

<g transform="translate(215,182)"><rect x="-135" y="-70" width="270" height="140" rx="12" fill="#0d1b2a" stroke="#8fe3b0" stroke-width="2"></rect><text x="0" y="-48" text-anchor="middle" font-size="15" fill="#8fe3b0" font-weight="bold">the Cabinet</text><text x="0" y="-20" text-anchor="middle" font-size="30">🎮</text><g font-size="11" fill="#d8f5e2"><rect x="-112" y="8" width="100" height="46" rx="7" fill="#14243a" stroke="#4a6b8a" stroke-width="1"></rect><text x="-62" y="26" text-anchor="middle" font-weight="bold">station 1</text><text x="-62" y="44" text-anchor="middle">GPU passthrough</text><rect x="12" y="8" width="100" height="46" rx="7" fill="#14243a" stroke="#4a6b8a" stroke-width="1"></rect><text x="62" y="26" text-anchor="middle" font-weight="bold">station 2</text><text x="62" y="44" text-anchor="middle">emulated display</text></g></g>

<g transform="translate(512,182)"><rect x="-70" y="-34" width="140" height="68" rx="10" fill="#3a2a1f" stroke="#ffd27f" stroke-width="2"></rect><text x="0" y="-10" text-anchor="middle" font-size="22">☸️</text><text x="0" y="18" text-anchor="middle" font-size="11" fill="#ffe9c2" font-weight="bold">the pods leave</text></g>

<g stroke="#ffb3ea" stroke-width="3" fill="none" marker-end="url(#arrowaken)"><path d="M 356 168 L 438 168"></path><path d="M 588 168 L 690 168"></path></g>
<text x="639" y="150" text-anchor="middle" font-size="12" fill="#ffb3ea" font-weight="bold">relocate</text>

<g transform="translate(830,182)"><rect x="-120" y="-56" width="240" height="112" rx="12" fill="#0d1b2a" stroke="#7fb3ff" stroke-width="2"></rect><text x="0" y="-30" text-anchor="middle" font-size="15" fill="#7fb3ff" font-weight="bold">the rest of the cluster</text><g><circle cx="-70" cy="8" r="18" fill="#14243a" stroke="#7fb3ff" stroke-width="1"></circle><text x="-70" y="14" text-anchor="middle" font-size="16">☸️</text><circle cx="0" cy="8" r="18" fill="#14243a" stroke="#7fb3ff" stroke-width="1"></circle><text x="0" y="14" text-anchor="middle" font-size="16">☸️</text><circle cx="70" cy="8" r="18" fill="#14243a" stroke="#7fb3ff" stroke-width="1"></circle><text x="70" y="14" text-anchor="middle" font-size="16">☸️</text></g></g>

<text x="512" y="298" text-anchor="middle" font-size="16" fill="#ffffff" font-weight="bold" opacity="0.9">when someone plays, Kubernetes moves to the other room</text>
