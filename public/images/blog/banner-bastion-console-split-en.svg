<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 320" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="Illustration: a small Raspberry Pi carrying a keyring (the bastion) separated from a large virtual machine containing a terminal (the console), linked by a moving arrow"><defs><linearGradient id="bgbcs" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#16213a"></stop><stop offset="100%" stop-color="#1f3f6e"></stop></linearGradient></defs><rect x="0" y="0" width="1024" height="320" fill="url(#bgbcs)"></rect><g fill="#ffffff" opacity="0.05"><ellipse cx="140" cy="55" rx="120" ry="38"></ellipse><ellipse cx="900" cy="60" rx="150" ry="40"></ellipse></g><text x="512" y="52" text-anchor="middle" font-size="30" fill="#ffffff" font-weight="bold">Splitting the Bastion from the Console</text><g transform="translate(200,190)"><rect x="-85" y="-55" width="170" height="110" rx="10" fill="#0d1b2a" stroke="#8fe3b0" stroke-width="2"></rect><text x="0" y="-30" text-anchor="middle" font-size="12" fill="#8fe3b0" font-family="monospace">pi-02 · bastion</text><g transform="translate(-30,8)"><circle cx="0" cy="0" r="14" fill="none" stroke="#ffd98a" stroke-width="3"></circle><rect x="10" y="-3" width="26" height="6" fill="#ffd98a"></rect><rect x="28" y="3" width="4" height="7" fill="#ffd98a"></rect><rect x="20" y="3" width="4" height="10" fill="#ffd98a"></rect></g><text x="0" y="42" text-anchor="middle" font-size="10" fill="#a9c0e0">service keys · secrets · survivor UPS</text></g><g stroke="#5ec2ff" stroke-width="3" stroke-dasharray="7 6"><line x1="315" y1="185" x2="450" y2="185"></line></g><path d="M450,178 L466,185 L450,192 Z" fill="#5ec2ff"></path><g transform="translate(660,185)"><rect x="-185" y="-95" width="370" height="190" rx="12" fill="#101c30" stroke="#5ec2ff" stroke-width="2.5" stroke-dasharray="8 5"></rect><rect x="-165" y="-75" width="330" height="150" rx="8" fill="#0d1b2a" stroke="#8fe3b0" stroke-width="2"></rect><rect x="-165" y="-75" width="330" height="24" rx="8" fill="#1b2a44"></rect><circle cx="-147" cy="-63" r="5" fill="#ff8a8a"></circle><circle cx="-129" cy="-63" r="5" fill="#ffd98a"></circle><circle cx="-111" cy="-63" r="5" fill="#8fe3b0"></circle><text x="0" y="-59" text-anchor="middle" font-size="11" fill="#a9c0e0">console-vm · 16 GB</text><text x="-145" y="-20" font-size="13" fill="#8fe3b0" font-family="monospace">$ ssh console</text><text x="-145" y="5" font-size="13" fill="#d8f5e2" font-family="monospace">&gt; 12g of memory... finally</text><text x="-145" y="30" font-size="13" fill="#5ec2ff" font-family="monospace">&gt; _</text><text x="0" y="62" text-anchor="middle" font-size="10" fill="#a9c0e0">dedicated VM on the GPU server</text></g><text x="512" y="298" text-anchor="middle" font-size="17" fill="#ffffff" font-weight="bold" opacity="0.9">one role per machine — the name follows the shell</text></svg>
