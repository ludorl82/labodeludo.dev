<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 320" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="Illustration : un robot assis à un établi tient une loupe au bout d'un tuyau qui sort du mur ; sur l'établi, deux boîtes étiquetées « recherche_web » et « horaires_cinema », un rouleau de gabarit déroulé, et une petite pancarte « l'heure en dernier »">
  <defs>
    <linearGradient id="bgatelier" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#171d27"/>
      <stop offset="100%" stop-color="#2b3647"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="320" fill="url(#bgatelier)"/>
  <!-- workbench -->
  <rect x="0" y="236" width="1024" height="84" fill="#3b3128"/>
  <rect x="0" y="232" width="1024" height="8" fill="#5a4a3a"/>

  <!-- the pipe from the wall, ending in a magnifier -->
  <path d="M0,120 C120,120 160,150 240,150" fill="none" stroke="#7d8898" stroke-width="12" stroke-linecap="round"/>
  <path d="M0,120 C120,120 160,150 240,150" fill="none" stroke="#a9b3c1" stroke-width="4" stroke-linecap="round"/>
  <circle cx="262" cy="150" r="20" fill="none" stroke="#e8c46a" stroke-width="6"/>
  <text x="70" y="104" font-size="12" fill="#c8d3e3">internet (Tavily)</text>

  <!-- the robot at the bench -->
  <g transform="translate(330,86)">
    <rect x="34" y="20" width="56" height="48" rx="8" fill="#b9c3d1" stroke="#7d8898" stroke-width="3"/>
    <circle cx="52" cy="40" r="6" fill="#2d7dd2"/><circle cx="72" cy="40" r="6" fill="#2d7dd2"/>
    <rect x="48" y="52" width="28" height="4" rx="2" fill="#5a6470"/>
    <line x1="62" y1="20" x2="62" y2="6" stroke="#7d8898" stroke-width="3"/><circle cx="62" cy="4" r="4" fill="#e8c46a"/>
    <rect x="30" y="70" width="64" height="76" rx="6" fill="#98a4b5" stroke="#7d8898" stroke-width="3"/>
    <path d="M30,95 L-40,70" stroke="#98a4b5" stroke-width="10" stroke-linecap="round"/>
    <path d="M94,100 L150,132" stroke="#98a4b5" stroke-width="10" stroke-linecap="round"/>
  </g>

  <!-- two boxes -->
  <g transform="translate(520,166)">
    <rect x="0" y="0" width="150" height="66" rx="6" fill="#e8ecf2" stroke="#7d8898" stroke-width="3"/>
    <text x="75" y="28" text-anchor="middle" font-size="13" fill="#2d3748" font-family="monospace">recherche_web</text>
    <text x="75" y="50" text-anchor="middle" font-size="11" fill="#5a6470">script exposé</text>
  </g>
  <g transform="translate(690,166)">
    <rect x="0" y="0" width="160" height="66" rx="6" fill="#e8ecf2" stroke="#7d8898" stroke-width="3"/>
    <text x="80" y="28" text-anchor="middle" font-size="13" fill="#2d3748" font-family="monospace">horaires_cinema</text>
    <text x="80" y="50" text-anchor="middle" font-size="11" fill="#5a6470">script exposé</text>
  </g>

  <!-- the unrolled template -->
  <g transform="translate(540,60)">
    <rect x="0" y="0" width="340" height="86" rx="4" fill="#f4f1e8" stroke="#c9c2b0" stroke-width="3"/>
    <text x="14" y="24" font-size="12" fill="#5a6470" font-family="monospace">{% for t in salles %}{% for d in dates %}</text>
    <text x="14" y="44" font-size="12" fill="#5a6470" font-family="monospace">  … heures | unique | sort | join</text>
    <text x="14" y="64" font-size="12" fill="#5a6470" font-family="monospace">{% endfor %}{% endfor %}</text>
    <text x="14" y="80" font-size="11" fill="#b5342b" font-family="monospace">Nous sommes le 14/09 et il est 18:41.</text>
  </g>

  <!-- the sign -->
  <g transform="translate(900,150) rotate(6)">
    <rect x="0" y="0" width="110" height="44" rx="6" fill="#e8c46a"/>
    <text x="55" y="19" text-anchor="middle" font-size="12" fill="#2d3748" font-weight="bold">l'heure</text>
    <text x="55" y="36" text-anchor="middle" font-size="12" fill="#2d3748" font-weight="bold">en dernier</text>
  </g>
</svg>
