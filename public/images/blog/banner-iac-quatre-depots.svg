<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 320" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="Illustration : quatre dépôts git empilés relié chacun à un filtre en forme de bouclier, d'où sort une version publique assainie affichée sur un écran, symbolisant la publication d'une infrastructure décrite en code sans en révéler les identifiants">
  <defs>
    <linearGradient id="bgiac" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#16283e"/>
      <stop offset="100%" stop-color="#274a6e"/>
    </linearGradient>
    <linearGradient id="repoiac" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8fb8ff"/>
      <stop offset="100%" stop-color="#5ec2ff"/>
    </linearGradient>
    <linearGradient id="pubiac" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7fd4a8"/>
      <stop offset="100%" stop-color="#4fb98a"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1024" height="320" fill="url(#bgiac)"/>
  <g fill="#ffffff" opacity="0.05">
    <ellipse cx="150" cy="52" rx="130" ry="40"/>
    <ellipse cx="880" cy="268" rx="150" ry="46"/>
  </g>

  <!-- les quatre dépôts privés -->
  <g>
    <g transform="translate(70,44)">
      <rect x="0" y="0" width="180" height="48" rx="8" fill="url(#repoiac)"/>
      <circle cx="22" cy="24" r="6" fill="#16283e"/>
      <rect x="42" y="16" width="112" height="6" rx="3" fill="#16283e" opacity="0.55"/>
      <rect x="42" y="28" width="74" height="6" rx="3" fill="#16283e" opacity="0.35"/>
    </g>
    <g transform="translate(70,108)">
      <rect x="0" y="0" width="180" height="48" rx="8" fill="url(#repoiac)"/>
      <circle cx="22" cy="24" r="6" fill="#16283e"/>
      <rect x="42" y="16" width="112" height="6" rx="3" fill="#16283e" opacity="0.55"/>
      <rect x="42" y="28" width="90" height="6" rx="3" fill="#16283e" opacity="0.35"/>
    </g>
    <g transform="translate(70,172)">
      <rect x="0" y="0" width="180" height="48" rx="8" fill="url(#repoiac)"/>
      <circle cx="22" cy="24" r="6" fill="#16283e"/>
      <rect x="42" y="16" width="112" height="6" rx="3" fill="#16283e" opacity="0.55"/>
      <rect x="42" y="28" width="60" height="6" rx="3" fill="#16283e" opacity="0.35"/>
    </g>
    <g transform="translate(70,236)">
      <rect x="0" y="0" width="180" height="48" rx="8" fill="url(#repoiac)"/>
      <circle cx="22" cy="24" r="6" fill="#16283e"/>
      <rect x="42" y="16" width="112" height="6" rx="3" fill="#16283e" opacity="0.55"/>
      <rect x="42" y="28" width="84" height="6" rx="3" fill="#16283e" opacity="0.35"/>
    </g>
  </g>

  <!-- convergence vers la barrière -->
  <g stroke="#9fd8ff" stroke-width="4" fill="none" opacity="0.8">
    <path d="M 250 68  C 330 68  350 130 420 152"/>
    <path d="M 250 132 C 330 132 350 148 420 158"/>
    <path d="M 250 196 C 330 196 350 174 420 166"/>
    <path d="M 250 260 C 330 260 350 194 420 172"/>
  </g>

  <!-- la barrière de vérification : bouclier + crochet -->
  <g transform="translate(432,88)">
    <path d="M 76 0 L 152 30 L 152 84 C 152 132 116 160 76 176 C 36 160 0 132 0 84 L 0 30 Z"
          fill="#16283e" stroke="#e8f6ff" stroke-width="5" opacity="0.96"/>
    <path d="M 44 88 L 66 112 L 110 62" fill="none" stroke="#7fd4a8"
          stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- sortie assainie -->
  <g stroke="#7fd4a8" stroke-width="4" stroke-dasharray="10 8" fill="none" opacity="0.9">
    <path d="M 590 176 L 690 176"/>
  </g>

  <!-- l'écran public -->
  <g transform="translate(700,96)">
    <rect x="0" y="0" width="248" height="152" rx="12" fill="#16283e" stroke="#7fd4a8" stroke-width="4"/>
    <!-- diagramme simplifié à l'écran -->
    <g fill="url(#pubiac)">
      <rect x="26" y="28" width="66" height="26" rx="6"/>
      <rect x="156" y="28" width="66" height="26" rx="6"/>
      <rect x="26" y="98" width="66" height="26" rx="6"/>
      <rect x="156" y="98" width="66" height="26" rx="6"/>
    </g>
    <g stroke="#9fd8ff" stroke-width="4" fill="none" opacity="0.85">
      <path d="M 92 41 L 156 41"/>
      <path d="M 92 111 L 156 111"/>
      <path d="M 59 54 L 59 98"/>
      <path d="M 189 54 L 189 98"/>
    </g>
    <!-- pastille « vérifié » -->
    <circle cx="222" cy="130" r="12" fill="#7fd4a8"/>
    <path d="M 216 130 L 220 135 L 229 125" fill="none" stroke="#16283e"
          stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
