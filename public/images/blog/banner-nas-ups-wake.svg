<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 320" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="Illustration : un éclair de microcoupure au-dessus d'une maison, un onduleur qui alimente un NAS endormi dans un lit, et un Raspberry Pi qui sonne un réveille-matin en lui envoyant un paquet magique">
  <defs>
    <linearGradient id="bgwake" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a2030"/>
      <stop offset="100%" stop-color="#33415e"/>
    </linearGradient>
    <linearGradient id="upsbox" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3f4f6e"/>
      <stop offset="100%" stop-color="#2c3a54"/>
    </linearGradient>
    <linearGradient id="nasbed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9aa8c0"/>
      <stop offset="100%" stop-color="#6d7f9e"/>
    </linearGradient>
    <linearGradient id="blanket" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5ec2ff"/>
      <stop offset="100%" stop-color="#3a7fd5"/>
    </linearGradient>
    <linearGradient id="pibox" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf7d"/>
      <stop offset="100%" stop-color="#2e7d54"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1024" height="320" fill="url(#bgwake)"/>
  <g fill="#ffffff" opacity="0.05">
    <ellipse cx="160" cy="52" rx="140" ry="40"/>
    <ellipse cx="880" cy="270" rx="150" ry="44"/>
  </g>

  <!-- flicker bolt over the scene -->
  <g>
    <polygon points="150,28 122,92 146,92 118,158 176,84 150,84 178,28" fill="#ffd166" opacity="0.9"/>
    <text x="200" y="60" fill="#ffd166" font-size="20" opacity="0.85">⚡ microcoupures</text>
  </g>

  <!-- UPS on the left: tower with battery bars -->
  <g>
    <rect x="70" y="150" width="150" height="130" rx="10" fill="url(#upsbox)" stroke="#8fa3c8" stroke-width="2"/>
    <rect x="90" y="170" width="110" height="34" rx="6" fill="#0e1a12"/>
    <rect x="96" y="176" width="20" height="22" fill="#59d98c"/>
    <rect x="120" y="176" width="20" height="22" fill="#59d98c"/>
    <rect x="144" y="176" width="20" height="22" fill="#59d98c"/>
    <rect x="168" y="176" width="20" height="22" fill="#59d98c" opacity="0.35"/>
    <text x="145" y="232" fill="#c9d6ee" font-size="16" text-anchor="middle">OR700</text>
    <circle cx="110" cy="256" r="7" fill="#59d98c"/>
    <text x="126" y="261" fill="#9fb2d4" font-size="13">OL</text>
  </g>

  <!-- power cords from UPS to bed and to pi -->
  <path d="M220 250 C 300 250 320 262 392 262" stroke="#59d98c" stroke-width="5" fill="none" stroke-linecap="round"/>
  <path d="M220 236 C 420 200 610 236 738 244" stroke="#59d98c" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.7"/>

  <!-- NAS asleep in a bed, center -->
  <g>
    <!-- bed frame -->
    <rect x="392" y="238" width="270" height="42" rx="8" fill="#4a3b2e"/>
    <rect x="384" y="196" width="18" height="84" rx="5" fill="#5d4a39"/>
    <rect x="654" y="216" width="18" height="64" rx="5" fill="#5d4a39"/>
    <!-- pillow -->
    <rect x="404" y="212" width="70" height="30" rx="12" fill="#e8ecf5"/>
    <!-- NAS head: small box with two drive bays as closed eyes -->
    <rect x="412" y="188" width="76" height="46" rx="8" fill="url(#nasbed)" stroke="#42506b" stroke-width="2"/>
    <path d="M428 208 q6 6 12 0" stroke="#2c3548" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M458 208 q6 6 12 0" stroke="#2c3548" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- blanket over the body -->
    <path d="M488 238 q10 -26 40 -26 h96 q30 0 30 26 z" fill="url(#blanket)"/>
    <!-- zzz -->
    <text x="520" y="150" fill="#c9d6ee" font-size="30" opacity="0.9">z</text>
    <text x="548" y="126" fill="#c9d6ee" font-size="38" opacity="0.75">z</text>
    <text x="584" y="100" fill="#c9d6ee" font-size="46" opacity="0.6">z</text>
    <text x="527" y="300" fill="#9fb2d4" font-size="15" text-anchor="middle">état précédent : éteint (et fier de l'être)</text>
  </g>

  <!-- Raspberry Pi on the right, ringing an alarm clock, sending magic packet -->
  <g>
    <rect x="738" y="216" width="120" height="64" rx="8" fill="url(#pibox)" stroke="#79d9a8" stroke-width="2"/>
    <circle cx="758" cy="234" r="5" fill="#ffd166"/>
    <circle cx="776" cy="234" r="5" fill="#ff7b7b"/>
    <rect x="748" y="252" width="100" height="18" rx="4" fill="#153826"/>
    <text x="798" y="265" fill="#8ff0bb" font-size="12" text-anchor="middle">wol aa:bb:cc…</text>
    <text x="798" y="300" fill="#9fb2d4" font-size="15" text-anchor="middle">maître NUT + verrou WoL</text>
    <!-- alarm clock above the pi -->
    <g>
      <circle cx="900" cy="160" r="34" fill="#e8ecf5" stroke="#42506b" stroke-width="3"/>
      <line x1="900" y1="160" x2="900" y2="138" stroke="#42506b" stroke-width="3" stroke-linecap="round"/>
      <line x1="900" y1="160" x2="916" y2="168" stroke="#42506b" stroke-width="3" stroke-linecap="round"/>
      <circle cx="878" cy="130" r="8" fill="#ffd166"/>
      <circle cx="922" cy="130" r="8" fill="#ffd166"/>
      <path d="M856 138 q-8 -10 -2 -20" stroke="#c9d6ee" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M944 138 q8 -10 2 -20" stroke="#c9d6ee" stroke-width="3" fill="none" stroke-linecap="round"/>
    </g>
    <!-- magic packet envelope flying toward the bed -->
    <g>
      <rect x="672" y="168" width="52" height="34" rx="6" fill="#ffd166" stroke="#b98f2f" stroke-width="2"/>
      <path d="M672 172 l26 18 26 -18" stroke="#b98f2f" stroke-width="2" fill="none"/>
      <path d="M736 186 q-40 4 -66 20" stroke="#ffd166" stroke-width="3" fill="none" stroke-dasharray="6 7" stroke-linecap="round"/>
      <text x="698" y="160" fill="#ffd166" font-size="14" text-anchor="middle">paquet magique</text>
    </g>
  </g>
</svg>
