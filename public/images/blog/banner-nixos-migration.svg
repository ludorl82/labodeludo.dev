<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 320" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="Illustration : un flocon de neige stylisé relié à une rangée de serveurs, de mini-ordinateurs et d'un nuage, symbolisant un parc complet géré par NixOS depuis un seul dépôt">
  <defs>
    <linearGradient id="bgnix" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#16283e"/>
      <stop offset="100%" stop-color="#274a6e"/>
    </linearGradient>
    <linearGradient id="nodenix" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8fb8ff"/>
      <stop offset="100%" stop-color="#5ec2ff"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1024" height="320" fill="url(#bgnix)"/>
  <g fill="#ffffff" opacity="0.05">
    <ellipse cx="140" cy="60" rx="120" ry="38"/>
    <ellipse cx="900" cy="250" rx="150" ry="46"/>
  </g>

  <!-- flocon stylisé (6 branches) -->
  <g transform="translate(200,150)" stroke="#9fd8ff" stroke-width="10" stroke-linecap="round">
    <g>
      <line x1="0" y1="-78" x2="0" y2="78"/>
      <line x1="-67" y1="-39" x2="67" y2="39"/>
      <line x1="-67" y1="39" x2="67" y2="-39"/>
    </g>
    <g stroke-width="6">
      <line x1="0" y1="-78" x2="-16" y2="-58"/>
      <line x1="0" y1="-78" x2="16" y2="-58"/>
      <line x1="0" y1="78" x2="-16" y2="58"/>
      <line x1="0" y1="78" x2="16" y2="58"/>
      <line x1="-67" y1="-39" x2="-44" y2="-40"/>
      <line x1="67" y1="39" x2="44" y2="40"/>
      <line x1="-67" y1="39" x2="-44" y2="40"/>
      <line x1="67" y1="-39" x2="44" y2="-40"/>
    </g>
    <circle cx="0" cy="0" r="14" fill="#e8f6ff" stroke="none"/>
  </g>

  <!-- lien flocon -> flotte -->
  <g stroke="#7fd4a8" stroke-width="4" stroke-dasharray="10 8" fill="none" opacity="0.85">
    <path d="M 300 150 C 380 150 380 120 450 108"/>
    <path d="M 300 150 C 380 150 380 180 450 192"/>
    <path d="M 300 150 L 450 150"/>
  </g>

  <!-- serveurs -->
  <g>
    <g transform="translate(470,84)">
      <rect x="0" y="0" width="150" height="48" rx="8" fill="url(#nodenix)"/>
      <circle cx="20" cy="24" r="6" fill="#16283e"/>
      <rect x="40" y="16" width="90" height="6" rx="3" fill="#16283e" opacity="0.55"/>
      <rect x="40" y="28" width="60" height="6" rx="3" fill="#16283e" opacity="0.35"/>
    </g>
    <g transform="translate(470,146)">
      <rect x="0" y="0" width="150" height="48" rx="8" fill="url(#nodenix)"/>
      <circle cx="20" cy="24" r="6" fill="#16283e"/>
      <rect x="40" y="16" width="90" height="6" rx="3" fill="#16283e" opacity="0.55"/>
      <rect x="40" y="28" width="60" height="6" rx="3" fill="#16283e" opacity="0.35"/>
    </g>
    <g transform="translate(470,208)">
      <rect x="0" y="0" width="150" height="48" rx="8" fill="url(#nodenix)"/>
      <circle cx="20" cy="24" r="6" fill="#16283e"/>
      <rect x="40" y="16" width="90" height="6" rx="3" fill="#16283e" opacity="0.55"/>
      <rect x="40" y="28" width="60" height="6" rx="3" fill="#16283e" opacity="0.35"/>
    </g>
  </g>

  <!-- mini-ordinateurs (Pi) -->
  <g transform="translate(680,110)">
    <rect x="0" y="0" width="70" height="44" rx="6" fill="#7fd4a8"/>
    <rect x="8" y="8" width="18" height="12" rx="2" fill="#16283e" opacity="0.6"/>
    <circle cx="56" cy="30" r="5" fill="#16283e" opacity="0.6"/>
  </g>
  <g transform="translate(680,170)">
    <rect x="0" y="0" width="70" height="44" rx="6" fill="#7fd4a8"/>
    <rect x="8" y="8" width="18" height="12" rx="2" fill="#16283e" opacity="0.6"/>
    <circle cx="56" cy="30" r="5" fill="#16283e" opacity="0.6"/>
  </g>

  <!-- nuage -->
  <g transform="translate(800,84)" fill="#e8f6ff">
    <ellipse cx="70" cy="40" rx="58" ry="26"/>
    <circle cx="40" cy="26" r="24"/>
    <circle cx="86" cy="20" r="28"/>
    <rect x="46" y="30" width="50" height="22" rx="4" fill="#16283e" opacity="0.25"/>
  </g>

  <!-- étiquette git -->
  <g transform="translate(60,236)">
    <rect x="0" y="0" width="280" height="44" rx="10" fill="#0e1c2c" opacity="0.75"/>
    <text x="16" y="28" font-size="20" fill="#8fe3b0" font-family="monospace">git push → machines</text>
  </g>
</svg>
