<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 320" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="Illustration nocturne : un robot dessinateur assis devant une planche à dessin redessine l'élévation d'un rack qu'il n'a jamais vu, à partir d'un fichier de données ; une horloge marque quatre heures et demie du matin et un tampon de refus est posé sur un feuillet à côté">
  <defs>
    <linearGradient id="bgnuit" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#141c29"/>
      <stop offset="100%" stop-color="#26344a"/>
    </linearGradient>
    <linearGradient id="botbody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5a6d92"/>
      <stop offset="100%" stop-color="#36445f"/>
    </linearGradient>
    <linearGradient id="board" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cfd9e8"/>
    </linearGradient>
    <linearGradient id="rackframe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3d4c68"/>
      <stop offset="100%" stop-color="#26344a"/>
    </linearGradient>
    <radialGradient id="lamp" cx="0.5" cy="0" r="1">
      <stop offset="0%" stop-color="#ffd98a" stop-opacity="0.42"/>
      <stop offset="100%" stop-color="#ffd98a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="1024" height="320" fill="url(#bgnuit)"/>

  <!-- night sky specks -->
  <g fill="#ffffff" opacity="0.16">
    <circle cx="88" cy="38" r="1.6"/>
    <circle cx="212" cy="26" r="1.2"/>
    <circle cx="366" cy="44" r="1.5"/>
    <circle cx="520" cy="22" r="1.2"/>
    <circle cx="676" cy="40" r="1.6"/>
    <circle cx="842" cy="28" r="1.3"/>
    <circle cx="960" cy="52" r="1.5"/>
  </g>

  <!-- faint grid -->
  <g fill="#ffffff" opacity="0.04">
    <rect x="0" y="80" width="1024" height="1"/>
    <rect x="0" y="160" width="1024" height="1"/>
    <rect x="0" y="240" width="1024" height="1"/>
  </g>

  <!-- lamp glow over the desk -->
  <ellipse cx="470" cy="150" rx="300" ry="150" fill="url(#lamp)"/>

  <!-- clock: 04:30 — the only hour left in the chain; everything after it is
       chained off the step before, so this is the one alarm that exists -->
  <g transform="translate(86,72)">
    <circle cx="0" cy="0" r="34" fill="#1c2536" stroke="#4a5a76" stroke-width="3"/>
    <g stroke="#8fb6d8" stroke-width="3" stroke-linecap="round">
      <path d="M0 0 L 0 20"/>
      <path d="M0 0 L 10.6 10.6"/>
    </g>
    <circle cx="0" cy="0" r="3" fill="#5ec2ff"/>
    <text x="0" y="58" text-anchor="middle" fill="#8fa1bd" font-size="14">04:30</text>
  </g>

  <!-- the robot draughtsman -->
  <g transform="translate(196,120)">
    <!-- stool -->
    <rect x="18" y="122" width="10" height="42" rx="4" fill="#33445f"/>
    <rect x="-4" y="112" width="56" height="12" rx="6" fill="#3d4c68"/>
    <!-- body -->
    <rect x="-8" y="48" width="64" height="70" rx="12" fill="url(#botbody)"/>
    <!-- head -->
    <rect x="-2" y="4" width="52" height="42" rx="10" fill="url(#botbody)"/>
    <rect x="6" y="16" width="36" height="16" rx="6" fill="#141c29"/>
    <circle cx="16" cy="24" r="4.5" fill="#5ec2ff"/>
    <circle cx="32" cy="24" r="4.5" fill="#5ec2ff"/>
    <path d="M24 4 L 24 -8" stroke="#5a6d92" stroke-width="3"/>
    <circle cx="24" cy="-12" r="4" fill="#4caf7d"/>
    <!-- drawing arm reaching to the board -->
    <path d="M52 70 L 104 92" stroke="#5a6d92" stroke-width="11" stroke-linecap="round"/>
    <path d="M104 92 L 132 84" stroke="#6d7f9c" stroke-width="7" stroke-linecap="round"/>
  </g>

  <!-- drawing board with the rack elevation -->
  <g transform="translate(336,72)">
    <rect x="-10" y="-10" width="252" height="192" rx="8" fill="#33445f"/>
    <rect x="0" y="0" width="232" height="172" rx="4" fill="url(#board)"/>

    <!-- rack frame drawn on the sheet -->
    <g transform="translate(30,16)">
      <rect x="0" y="0" width="86" height="140" rx="3" fill="url(#rackframe)" opacity="0.16" stroke="#5a6d92" stroke-width="2"/>
      <g fill="#8fb6d8" opacity="0.9">
        <rect x="8" y="10" width="70" height="14" rx="2"/>
        <rect x="8" y="30" width="70" height="14" rx="2"/>
        <rect x="8" y="50" width="70" height="14" rx="2"/>
        <rect x="8" y="70" width="70" height="14" rx="2"/>
      </g>
      <g fill="#4caf7d">
        <rect x="8" y="92" width="70" height="16" rx="2"/>
        <rect x="8" y="114" width="70" height="16" rx="2"/>
      </g>
      <text x="43" y="-4" text-anchor="middle" fill="#5a6d92" font-size="10">8U</text>
    </g>

    <!-- second, taller rack -->
    <g transform="translate(134,16)">
      <rect x="0" y="0" width="70" height="140" rx="3" fill="url(#rackframe)" opacity="0.16" stroke="#5a6d92" stroke-width="2"/>
      <g fill="#8fb6d8" opacity="0.9">
        <rect x="7" y="12" width="56" height="18" rx="2"/>
        <rect x="7" y="36" width="56" height="18" rx="2"/>
        <rect x="7" y="60" width="56" height="18" rx="2"/>
      </g>
      <g fill="#4caf7d">
        <rect x="7" y="112" width="56" height="18" rx="2"/>
      </g>
      <text x="35" y="-4" text-anchor="middle" fill="#5a6d92" font-size="10">42U</text>
    </g>
  </g>

  <!-- data feeding the board -->
  <g transform="translate(614,96)">
    <rect x="0" y="0" width="128" height="112" rx="6" fill="#1c2536" stroke="#4a5a76" stroke-width="2"/>
    <text x="64" y="22" text-anchor="middle" fill="#5ec2ff" font-size="13" font-family="monospace">fleet.json</text>
    <g fill="#6d7f9c">
      <rect x="14" y="36" width="72" height="4" rx="2"/>
      <rect x="14" y="50" width="98" height="4" rx="2"/>
      <rect x="14" y="64" width="60" height="4" rx="2"/>
      <rect x="14" y="78" width="86" height="4" rx="2"/>
      <rect x="14" y="92" width="44" height="4" rx="2"/>
    </g>
  </g>
  <g fill="none" stroke="#5ec2ff" stroke-width="3" opacity="0.85">
    <path d="M610 152 L 584 152"/>
  </g>
  <path d="M584 144 L 566 152 L 584 160 Z" fill="#5ec2ff"/>

  <!-- the refused sheet with its stamp -->
  <g transform="translate(790,120)">
    <rect x="0" y="0" width="150" height="104" rx="5" fill="url(#board)" transform="rotate(-6)"/>
    <g transform="rotate(-6)" fill="#9aa9c0">
      <rect x="16" y="18" width="94" height="4" rx="2"/>
      <rect x="16" y="30" width="112" height="4" rx="2"/>
      <rect x="16" y="42" width="76" height="4" rx="2"/>
    </g>
    <g transform="translate(28,52) rotate(-14)">
      <rect x="0" y="0" width="104" height="34" rx="4" fill="none" stroke="#c9563f" stroke-width="3.5" opacity="0.9"/>
      <text x="52" y="23" text-anchor="middle" fill="#c9563f" font-size="16" font-weight="bold" opacity="0.95">REFUSÉ</text>
    </g>
  </g>
  <text x="865" y="256" text-anchor="middle" fill="#8fa1bd" font-size="14">pour un mot de français</text>
</svg>
