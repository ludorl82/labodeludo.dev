<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 320" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="Illustration : dans une cuisine, un petit haut-parleur vocal avec un anneau lumineux dit « aujourd'hui à 18h00 » dans une bulle ; à côté, un billet de cinéma et une horloge ; en arrière-plan, un câble part du haut-parleur vers une seule petite icône de loupe, et rien d'autre">
  <defs>
    <linearGradient id="bgcine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c2431"/>
      <stop offset="100%" stop-color="#2b3647"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="320" fill="url(#bgcine)"/>
  <!-- counter -->
  <rect x="0" y="230" width="1024" height="90" fill="#3b3128"/>
  <rect x="0" y="226" width="1024" height="8" fill="#5a4a3a"/>

  <!-- the speaker -->
  <g transform="translate(150,110)">
    <rect x="0" y="0" width="120" height="116" rx="18" fill="#e8ecf2" stroke="#b9c3d1" stroke-width="3"/>
    <circle cx="60" cy="58" r="34" fill="none" stroke="#2d7dd2" stroke-width="6"/>
    <circle cx="60" cy="58" r="22" fill="#d7dee8"/>
    <circle cx="60" cy="58" r="6" fill="#5a6470"/>
  </g>
  <!-- the bubble -->
  <g transform="translate(300,60)">
    <rect x="0" y="0" width="480" height="96" rx="14" fill="#f4f1e8" stroke="#c9c2b0" stroke-width="3"/>
    <polygon points="0,60 -22,80 4,84" fill="#f4f1e8" stroke="#c9c2b0" stroke-width="3"/>
    <text x="24" y="38" font-size="18" fill="#5a6470">« Ok Bob, à quelle heure joue le film ? »</text>
    <text x="24" y="72" font-size="21" fill="#2d3748" font-weight="bold">— Aujourd'hui à 18h00, puis 21h40.</text>
  </g>

  <!-- ticket -->
  <g transform="translate(750,160) rotate(-8)">
    <rect x="0" y="0" width="150" height="70" rx="8" fill="#e8c46a"/>
    <circle cx="0" cy="35" r="10" fill="#1c2431"/><circle cx="150" cy="35" r="10" fill="#1c2431"/>
    <line x1="105" y1="8" x2="105" y2="62" stroke="#b58f2a" stroke-width="2" stroke-dasharray="4 3"/>
    <text x="52" y="30" text-anchor="middle" font-size="12" fill="#5a4a1a" font-weight="bold">CINÉMA</text>
    <text x="52" y="52" text-anchor="middle" font-size="16" fill="#2d3748" font-family="monospace">18:00</text>
  </g>
  <!-- clock -->
  <g transform="translate(940,110)">
    <circle cx="0" cy="0" r="40" fill="#f4f1e8" stroke="#7d8898" stroke-width="4"/>
    <line x1="0" y1="0" x2="0" y2="-26" stroke="#2d3748" stroke-width="4" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="18" y2="10" stroke="#2d3748" stroke-width="4" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="3" fill="#2d3748"/>
    <text x="0" y="64" text-anchor="middle" font-size="12" fill="#c8d3e3">il est 17:42</text>
  </g>

  <!-- the one wire to the one tool -->
  <path d="M210,226 C210,280 420,280 470,280" fill="none" stroke="#d0a04a" stroke-width="3" stroke-dasharray="6 4"/>
  <g transform="translate(486,268)">
    <circle cx="0" cy="0" r="14" fill="none" stroke="#e8c46a" stroke-width="4"/>
    <line x1="10" y1="10" x2="24" y2="24" stroke="#e8c46a" stroke-width="4" stroke-linecap="round"/>
    <text x="40" y="8" font-size="13" fill="#c8d3e3">un seul outil : la recherche web</text>
  </g>
</svg>
