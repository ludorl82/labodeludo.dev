<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 320" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="Illustration: a terminal window asks a chatbot a question; the answer comes from a graphics card sitting in a basement, while the path to a cloud provider is struck through. A gate in between refuses any name or number the inventory does not contain."><defs><linearGradient id="bgpb" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#16222e"></stop><stop offset="100%" stop-color="#1d3350"></stop></linearGradient><marker id="arrpb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#8fe3b0"></path></marker><marker id="arrdead" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7a8a99"></path></marker></defs>

<rect width="1024" height="320" fill="url(#bgpb)"></rect>

<!-- le nuage débranché -->
<g opacity="0.45">
  <path d="M 700 54 a 26 26 0 0 1 50 -10 a 22 22 0 0 1 34 14 a 20 20 0 0 1 -4 40 h -74 a 22 22 0 0 1 -6 -44 z" fill="none" stroke="#7a8a99" stroke-width="2"></path>
  <text x="742" y="82" fill="#7a8a99" font-size="12" text-anchor="middle">cloud</text>
  <path d="M 585 120 L 700 78" stroke="#7a8a99" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#arrdead)"></path>
  <path d="M 630 88 l 30 26 M 660 88 l -30 26" stroke="#d78787" stroke-width="3.5" stroke-linecap="round"></path>
</g>
<text x="742" y="112" fill="#d78787" font-size="12" text-anchor="middle">removed after six days</text>

<!-- le terminal : la question -->
<rect x="48" y="96" width="330" height="150" rx="8" fill="#101a24" stroke="#8fe3b0" stroke-width="1.5"></rect>
<circle cx="68" cy="116" r="4" fill="#d78787"></circle><circle cx="82" cy="116" r="4" fill="#ffd700"></circle><circle cx="96" cy="116" r="4" fill="#8fe3b0"></circle>
<text x="68" y="152" fill="#8fe3b0" font-size="13" font-family="monospace">$ bob --chat</text>
<text x="68" y="180" fill="#d8d8d8" font-size="12.5" font-family="monospace">❯ gpu-02 has two RTX 3060s,</text>
<text x="68" y="198" fill="#d8d8d8" font-size="12.5" font-family="monospace">  right?</text>
<text x="68" y="226" fill="#ffd700" font-size="12.5" font-family="monospace">No — that would be gpu-01.</text>

<!-- la garde -->
<path d="M 378 171 L 436 171" stroke="#8fe3b0" stroke-width="2" marker-end="url(#arrpb)"></path>
<rect x="436" y="138" width="150" height="66" rx="6" fill="#12242f" stroke="#00afaf" stroke-width="1.5"></rect>
<text x="511" y="163" fill="#00afaf" font-size="12.5" text-anchor="middle">gate</text>
<text x="511" y="184" fill="#7fd4d4" font-size="10.5" text-anchor="middle">names and numbers</text>
<text x="511" y="197" fill="#7fd4d4" font-size="10.5" text-anchor="middle">not in the diff = refused</text>
<path d="M 586 171 L 644 171" stroke="#8fe3b0" stroke-width="2" marker-end="url(#arrpb)"></path>

<!-- le sous-sol : la carte -->
<rect x="644" y="120" width="300" height="132" rx="8" fill="#0f1d29" stroke="#8fe3b0" stroke-width="1.5"></rect>
<text x="794" y="146" fill="#8fe3b0" font-size="12.5" text-anchor="middle">in the basement</text>
<g>
  <rect x="676" y="162" width="100" height="52" rx="3" fill="#1d3350" stroke="#8fe3b0" stroke-width="1.4"></rect>
  <rect x="686" y="172" width="30" height="30" rx="2" fill="#8fe3b0" opacity="0.8"></rect>
  <rect x="724" y="176" width="42" height="5" rx="2" fill="#8fe3b0" opacity="0.5"></rect>
  <rect x="724" y="188" width="30" height="5" rx="2" fill="#8fe3b0" opacity="0.5"></rect>
  <rect x="812" y="162" width="100" height="52" rx="3" fill="#1d3350" stroke="#8fe3b0" stroke-width="1.4"></rect>
  <rect x="822" y="172" width="30" height="30" rx="2" fill="#8fe3b0" opacity="0.8"></rect>
  <rect x="860" y="176" width="42" height="5" rx="2" fill="#8fe3b0" opacity="0.5"></rect>
  <rect x="860" y="188" width="30" height="5" rx="2" fill="#8fe3b0" opacity="0.5"></rect>
</g>
<text x="794" y="236" fill="#d8d8d8" font-size="11.5" text-anchor="middle" font-family="monospace">2× RTX 3060 · 100 % GPU</text>

<!-- titre -->
<text x="48" y="62" fill="#ffffff" font-size="25" font-weight="600">The answer comes from here, not from elsewhere</text>
<text x="48" y="284" fill="#9fb3c8" font-size="13">A chatbot that knows only what the lab publishes — and refuses rather than invents</text>
</svg>
