<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 320" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="Illustration: a giant merge button connected by a conveyor belt to four servers; along the way, a checkpoint gate lets green changes through but blocks a red crate labeled destroy, held back by a barrier; a small human hand is required for the blocked crate">
  <defs>
    <linearGradient id="bgpipe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a2430"/>
      <stop offset="100%" stop-color="#2b4156"/>
    </linearGradient>
    <linearGradient id="beltg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#55647a"/>
      <stop offset="100%" stop-color="#3c4a5e"/>
    </linearGradient>
    <linearGradient id="crateok" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#79d189"/>
      <stop offset="100%" stop-color="#4aa763"/>
    </linearGradient>
    <linearGradient id="cratebad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0707a"/>
      <stop offset="100%" stop-color="#b04552"/>
    </linearGradient>
    <linearGradient id="srvg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9aa8c0"/>
      <stop offset="100%" stop-color="#6d7f9e"/>
    </linearGradient>
    <linearGradient id="btng" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8fb8ff"/>
      <stop offset="100%" stop-color="#5a86d6"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1024" height="320" fill="url(#bgpipe)"/>
  <g fill="#ffffff" opacity="0.05">
    <ellipse cx="180" cy="52" rx="150" ry="44"/>
    <ellipse cx="860" cy="270" rx="160" ry="46"/>
  </g>

  <!-- the merge button -->
  <g transform="translate(50,96)">
    <rect x="0" y="34" width="150" height="94" rx="12" fill="#2a3648"/>
    <rect x="17" y="0" width="116" height="72" rx="14" fill="url(#btng)"/>
    <text x="75" y="44" text-anchor="middle" font-size="24" font-weight="bold" fill="#10202e">merge</text>
    <text x="75" y="116" text-anchor="middle" font-size="15" fill="#c8d4e6">= deploy</text>
  </g>

  <!-- conveyor belt -->
  <rect x="200" y="196" width="560" height="26" rx="13" fill="url(#beltg)"/>
  <g fill="#22304200" stroke="#243246" stroke-width="3">
    <circle cx="232" cy="209" r="7"/><circle cx="312" cy="209" r="7"/><circle cx="392" cy="209" r="7"/>
    <circle cx="472" cy="209" r="7"/><circle cx="552" cy="209" r="7"/><circle cx="632" cy="209" r="7"/><circle cx="712" cy="209" r="7"/>
  </g>

  <!-- green crates rolling through -->
  <g>
    <rect x="238" y="152" width="52" height="42" rx="6" fill="url(#crateok)"/>
    <text x="264" y="180" text-anchor="middle" font-size="19" fill="#0d2b16">+</text>
    <rect x="650" y="152" width="52" height="42" rx="6" fill="url(#crateok)"/>
    <text x="676" y="180" text-anchor="middle" font-size="19" fill="#0d2b16">~</text>
  </g>

  <!-- the gate -->
  <g transform="translate(430,102)">
    <rect x="0" y="0" width="16" height="120" rx="5" fill="#7e8ca4"/>
    <rect x="104" y="0" width="16" height="120" rx="5" fill="#7e8ca4"/>
    <rect x="-6" y="-14" width="132" height="26" rx="8" fill="#7e8ca4"/>
    <text x="60" y="4" text-anchor="middle" font-size="14" font-weight="bold" fill="#1a2430">plan · gate</text>
    <!-- barrier arm down in front of the red crate -->
    <rect x="6" y="78" width="108" height="10" rx="5" fill="#ffd24d"/>
    <rect x="6" y="78" width="18" height="10" fill="#2a3648"/>
    <rect x="42" y="78" width="18" height="10" fill="#2a3648"/>
    <rect x="78" y="78" width="18" height="10" fill="#2a3648"/>
  </g>

  <!-- the refused destroy crate, stopped before the gate -->
  <g transform="translate(330,148)">
    <rect x="0" y="0" width="56" height="46" rx="6" fill="url(#cratebad)"/>
    <text x="28" y="22" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#33080d">destroy</text>
    <text x="28" y="40" text-anchor="middle" font-size="16" fill="#33080d">−</text>
    <!-- stop starburst -->
    <g transform="translate(64,-22)">
      <circle cx="0" cy="0" r="13" fill="#e0707a"/>
      <rect x="-8" y="-2.5" width="16" height="5" rx="2" fill="#fff"/>
    </g>
  </g>

  <!-- human hand required for the red crate -->
  <g transform="translate(300,232)" fill="#e8c39e">
    <rect x="0" y="18" width="34" height="14" rx="7"/>
    <rect x="26" y="6" width="9" height="20" rx="4.5"/>
    <rect x="14" y="2" width="9" height="24" rx="4.5"/>
    <rect x="2" y="6" width="9" height="20" rx="4.5"/>
  </g>
  <text x="352" y="258" font-size="13" fill="#c8d4e6">manual apply required</text>

  <!-- four target servers -->
  <g transform="translate(788,60)">
    <g>
      <rect x="0" y="0" width="176" height="48" rx="8" fill="url(#srvg)"/>
      <circle cx="18" cy="24" r="6" fill="#79d189"/>
      <text x="40" y="30" font-size="15" fill="#1a2430">Cloudflare</text>
    </g>
    <g transform="translate(0,58)">
      <rect x="0" y="0" width="176" height="48" rx="8" fill="url(#srvg)"/>
      <circle cx="18" cy="24" r="6" fill="#79d189"/>
      <text x="40" y="30" font-size="15" fill="#1a2430">AWS</text>
    </g>
    <g transform="translate(0,116)">
      <rect x="0" y="0" width="176" height="48" rx="8" fill="url(#srvg)"/>
      <circle cx="18" cy="24" r="6" fill="#79d189"/>
      <text x="40" y="30" font-size="15" fill="#1a2430">k3s ← Argo CD</text>
    </g>
    <g transform="translate(0,174)">
      <rect x="0" y="0" width="176" height="48" rx="8" fill="url(#srvg)"/>
      <circle cx="18" cy="24" r="6" fill="#79d189"/>
      <text x="40" y="30" font-size="15" fill="#1a2430">NixOS ← comin</text>
    </g>
  </g>

  <!-- title -->
  <text x="50" y="50" font-size="30" font-weight="bold" fill="#ffffff">Letting the pipeline press apply</text>
  <text x="50" y="76" font-size="16" fill="#c8d4e6">four repos, three tools, one gate that says no</text>
</svg>
