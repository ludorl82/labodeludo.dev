<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 320" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="Illustration : une maison-serveur avec une porte d'en avant marquée VLAN 10 et une porte d'en arrière marquée VLAN 50; une enveloppe entre par l'avant et la réponse sort par l'arrière. À droite, le portier du réseau : avant le correctif, un poisson rouge qui oublie en 30 secondes; après, un carnet de fiches gardées 24 heures">
  <defs>
    <linearGradient id="bgpa" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1c2333"/>
      <stop offset="100%" stop-color="#2e3f5c"/>
    </linearGradient>
    <marker id="pa-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8fa3c8"/>
    </marker>
    <marker id="pa-b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ffd166"/>
    </marker>
  </defs>

  <rect width="1024" height="320" fill="url(#bgpa)"/>

  <!-- la maison-serveur -->
  <g>
    <path d="M190,110 L330,40 L470,110 z" fill="#3a4a68" stroke="#5a6f96" stroke-width="3"/>
    <rect x="205" y="110" width="250" height="160" fill="#243149" stroke="#5a6f96" stroke-width="3"/>
    <!-- porte d'en avant : VLAN 10 -->
    <rect x="228" y="176" width="56" height="94" rx="4" fill="#7ec8ff"/>
    <circle cx="274" cy="226" r="4" fill="#1c2333"/>
    <text x="256" y="166" fill="#7ec8ff" font-size="15" text-anchor="middle">VLAN 10</text>
    <!-- porte d'en arrière : VLAN 50, entrouverte -->
    <rect x="376" y="176" width="56" height="94" rx="4" fill="#162033"/>
    <path d="M376,176 L408,184 L408,262 L376,270 z" fill="#ffd166"/>
    <text x="404" y="166" fill="#ffd166" font-size="15" text-anchor="middle">VLAN 50</text>
    <!-- fenêtre, un voyant -->
    <rect x="300" y="126" width="60" height="30" rx="3" fill="#162033" stroke="#5a6f96" stroke-width="2"/>
    <circle cx="350" cy="141" r="4" fill="#7ec8ff"/>
  </g>

  <!-- l'enveloppe qui entre par l'avant -->
  <g>
    <rect x="60" y="196" width="70" height="46" rx="4" fill="#dfe8f7"/>
    <path d="M60,196 L95,224 L130,196" fill="none" stroke="#8fa3c8" stroke-width="3"/>
    <path d="M136,219 L222,219" fill="none" stroke="#8fa3c8" stroke-width="4" marker-end="url(#pa-a)"/>
    <text x="95" y="270" fill="#8fa3c8" font-size="15" text-anchor="middle">demande</text>
  </g>

  <!-- la réponse qui sort par l'arrière -->
  <path d="M412,240 C470,250 500,268 540,284" fill="none" stroke="#ffd166" stroke-width="4" stroke-dasharray="12 8" marker-end="url(#pa-b)"/>
  <text x="560" y="300" fill="#ffd166" font-size="15">réponse</text>

  <!-- le portier, avant : un poisson rouge -->
  <g>
    <text x="700" y="52" fill="#8fa3c8" font-size="16" text-anchor="middle">avant</text>
    <path d="M640,96 C640,70 760,70 760,96 C790,140 760,200 700,200 C640,200 610,140 640,96 z" fill="#2a3a58" stroke="#7ec8ff" stroke-width="3" opacity="0.95"/>
    <path d="M644,110 L756,110" stroke="#7ec8ff" stroke-width="2" opacity="0.6"/>
    <ellipse cx="700" cy="150" rx="28" ry="16" fill="#ff8c42"/>
    <path d="M726,150 L748,136 L748,164 z" fill="#ff8c42"/>
    <circle cx="684" cy="146" r="3.5" fill="#1c2333"/>
    <text x="700" y="232" fill="#ffd166" font-size="18" font-weight="bold" text-anchor="middle">30 s</text>
  </g>

  <!-- le portier, après : un carnet de fiches -->
  <g>
    <text x="890" y="52" fill="#7ec8ff" font-size="16" text-anchor="middle">après</text>
    <rect x="836" y="76" width="112" height="132" rx="6" fill="#fdf6e3" stroke="#e0a832" stroke-width="3"/>
    <rect x="836" y="76" width="16" height="132" rx="4" fill="#e0a832"/>
    <path d="M864,106 L934,106 M864,126 L934,126 M864,146 L934,146 M864,166 L920,166" stroke="#b8a372" stroke-width="3" stroke-linecap="round"/>
    <text x="892" y="232" fill="#7ec8ff" font-size="18" font-weight="bold" text-anchor="middle">24 h</text>
  </g>
</svg>
