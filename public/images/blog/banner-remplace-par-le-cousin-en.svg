<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 320" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="Illustration: under an interrogation lamp, a tall drawing robot gets up from a chair and hands a pencil to a smaller robot wearing a « 0.06 $ » price tag; on the table, a polygraph whose needle has finally drawn a spike, and a sheet stamped « CORRECTED »">
  <defs>
    <linearGradient id="bgcousinen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f1319"/>
      <stop offset="100%" stop-color="#232b38"/>
    </linearGradient>
    <radialGradient id="lampe2en" cx="0.5" cy="0" r="0.8">
      <stop offset="0%" stop-color="#fff1c2" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#fff1c2" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1024" height="320" fill="url(#bgcousinen)"/>
  <!-- the lamp -->
  <line x1="330" y1="0" x2="330" y2="34" stroke="#555" stroke-width="3"/>
  <path d="M300,34 L360,34 L375,58 L285,58 Z" fill="#3b3b3b"/>
  <path d="M285,58 L375,58 L500,320 L160,320 Z" fill="url(#lampe2en)"/>

  <!-- the chair, now empty -->
  <g transform="translate(300,130)">
    <rect x="20" y="100" width="90" height="12" fill="#6b4f2e"/>
    <rect x="24" y="112" width="8" height="70" fill="#6b4f2e"/><rect x="98" y="112" width="8" height="70" fill="#6b4f2e"/>
    <rect x="94" y="30" width="12" height="80" fill="#6b4f2e"/>
  </g>

  <!-- the big robot, standing up, handing the pencil -->
  <g transform="translate(170,70)">
    <rect x="34" y="20" width="56" height="48" rx="8" fill="#b9c3d1" stroke="#7d8898" stroke-width="3"/>
    <circle cx="52" cy="40" r="6" fill="#2d7dd2"/><circle cx="72" cy="40" r="6" fill="#2d7dd2"/>
    <rect x="48" y="52" width="28" height="4" rx="2" fill="#5a6470"/>
    <line x1="62" y1="20" x2="62" y2="6" stroke="#7d8898" stroke-width="3"/><circle cx="62" cy="4" r="4" fill="#e8c46a"/>
    <rect x="30" y="70" width="64" height="90" rx="6" fill="#98a4b5" stroke="#7d8898" stroke-width="3"/>
    <rect x="36" y="160" width="20" height="60" fill="#7d8898"/><rect x="68" y="160" width="20" height="60" fill="#7d8898"/>
    <!-- arm with the pencil -->
    <path d="M94,90 L160,120" stroke="#98a4b5" stroke-width="10" stroke-linecap="round"/>
    <g transform="translate(150,112) rotate(25)">
      <rect x="0" y="-4" width="48" height="8" fill="#e8c46a"/>
      <polygon points="48,-4 58,0 48,4" fill="#f4f1e8"/>
    </g>
    <text x="62" y="240" text-anchor="middle" font-size="12" fill="#c8d3e3" font-family="monospace">Opus 5</text>
  </g>

  <!-- the small cousin, taking it -->
  <g transform="translate(400,150)">
    <rect x="18" y="10" width="40" height="34" rx="6" fill="#b9c3d1" stroke="#7d8898" stroke-width="3"/>
    <circle cx="31" cy="25" r="4" fill="#2d7dd2"/><circle cx="45" cy="25" r="4" fill="#2d7dd2"/>
    <rect x="28" y="34" width="20" height="3" rx="1.5" fill="#5a6470"/>
    <line x1="38" y1="10" x2="38" y2="0" stroke="#7d8898" stroke-width="3"/><circle cx="38" cy="-1" r="3" fill="#e8c46a"/>
    <rect x="16" y="46" width="44" height="60" rx="5" fill="#98a4b5" stroke="#7d8898" stroke-width="3"/>
    <rect x="20" y="106" width="14" height="40" fill="#7d8898"/><rect x="42" y="106" width="14" height="40" fill="#7d8898"/>
    <path d="M16,60 L-20,44" stroke="#98a4b5" stroke-width="8" stroke-linecap="round"/>
    <!-- price tag -->
    <g transform="translate(62,58) rotate(12)">
      <rect x="0" y="0" width="64" height="24" rx="4" fill="#e8c46a"/>
      <text x="32" y="17" text-anchor="middle" font-size="12" fill="#2d3748" font-weight="bold">0.06 $</text>
    </g>
    <text x="38" y="166" text-anchor="middle" font-size="12" fill="#c8d3e3" font-family="monospace">qwen3.8-flash</text>
  </g>

  <!-- the polygraph, with a spike at last -->
  <g transform="translate(560,150)">
    <rect x="0" y="0" width="300" height="110" rx="8" fill="#1e2631" stroke="#4a5769" stroke-width="3"/>
    <rect x="16" y="16" width="268" height="60" rx="3" fill="#f4f1e8"/>
    <polyline points="20,46 60,46 100,46 130,44 150,20 158,70 168,46 200,46 240,46 280,46" fill="none" stroke="#2f855a" stroke-width="2.5"/>
    <text x="150" y="98" text-anchor="middle" font-size="13" fill="#c8d3e3" font-family="monospace">true · true · FALSE · true · true</text>
  </g>

  <!-- the stamp -->
  <g transform="translate(880,40)">
    <g transform="rotate(-12)">
      <rect x="-20" y="0" width="190" height="54" rx="6" fill="none" stroke="#2f855a" stroke-width="4"/>
      <text x="75" y="36" text-anchor="middle" font-size="22" fill="#2f855a" font-weight="bold" font-family="monospace">CORRECTED</text>
    </g>
    <text x="60" y="100" text-anchor="middle" font-size="11" fill="#7d8898">15 / 15 · 5 / 5</text>
  </g>
</svg>
