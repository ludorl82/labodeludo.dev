<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 320" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="Illustration : une imprimante multifonction envoie une numérisation vers un conteneur, dont on retire une caisse d'outils encombrante ; la page continue vers un nuage de stockage puis vers un dossier infonuagique">
  <defs>
    <linearGradient id="bgscan" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1b2433"/>
      <stop offset="100%" stop-color="#31435f"/>
    </linearGradient>
    <linearGradient id="printerbody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#48597a"/>
      <stop offset="100%" stop-color="#2f3d56"/>
    </linearGradient>
    <linearGradient id="cratebox" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8a6a4a"/>
      <stop offset="100%" stop-color="#5f4830"/>
    </linearGradient>
    <linearGradient id="lambdabox" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4caf7d"/>
      <stop offset="100%" stop-color="#2e7d54"/>
    </linearGradient>
    <linearGradient id="sheet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#d3dcea"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1024" height="320" fill="url(#bgscan)"/>

  <!-- faint grid -->
  <g fill="#ffffff" opacity="0.05">
    <rect x="0" y="60" width="1024" height="1"/>
    <rect x="0" y="140" width="1024" height="1"/>
    <rect x="0" y="220" width="1024" height="1"/>
    <rect x="0" y="300" width="1024" height="1"/>
  </g>

  <!-- multifunction printer -->
  <g transform="translate(48,112)">
    <rect x="0" y="18" width="130" height="86" rx="9" fill="url(#printerbody)"/>
    <rect x="14" y="4" width="102" height="20" rx="5" fill="#5d7095"/>
    <rect x="26" y="-16" width="78" height="26" rx="3" fill="url(#sheet)"/>
    <rect x="34" y="-8" width="46" height="3" rx="1.5" fill="#9fb0c8"/>
    <rect x="34" y="-2" width="58" height="3" rx="1.5" fill="#9fb0c8"/>
    <circle cx="106" cy="42" r="7" fill="#5ec2ff"/>
    <rect x="18" y="62" width="94" height="26" rx="4" fill="#222d40"/>
    <text x="65" y="126" text-anchor="middle" font-size="15" fill="#c7d3e6">numériseur</text>
  </g>

  <!-- sheet in flight -->
  <g transform="translate(206,150)">
    <rect x="0" y="0" width="26" height="34" rx="2" fill="url(#sheet)" transform="rotate(-8)"/>
  </g>

  <!-- container: stock image, with the toolbox being lifted out -->
  <g transform="translate(276,96)">
    <rect x="0" y="26" width="168" height="112" rx="10" fill="#25334a" stroke="#5ec2ff" stroke-width="2"/>
    <text x="84" y="14" text-anchor="middle" font-size="15" fill="#5ec2ff">image officielle</text>
    <!-- neat contents -->
    <rect x="18" y="50" width="132" height="12" rx="6" fill="#3b4d6b"/>
    <rect x="18" y="72" width="96" height="12" rx="6" fill="#3b4d6b"/>
    <rect x="18" y="94" width="118" height="12" rx="6" fill="#3b4d6b"/>
    <text x="84" y="156" text-anchor="middle" font-size="14" fill="#9fb0c8">sans état</text>
  </g>

  <!-- the removed toolbox, lifted up and away, with a strike -->
  <g transform="translate(300,10)" opacity="0.85">
    <rect x="0" y="0" width="126" height="58" rx="7" fill="url(#cratebox)"/>
    <rect x="0" y="16" width="126" height="7" fill="#4a3826" opacity="0.7"/>
    <rect x="52" y="-9" width="22" height="12" rx="3" fill="#4a3826"/>
    <text x="63" y="38" text-anchor="middle" font-size="12" fill="#f0e2d0">crochet + outils</text>
    <line x1="6" y1="54" x2="120" y2="4" stroke="#ff6b6b" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- arrow container -> object storage -->
  <g stroke="#5ec2ff" stroke-width="3" fill="none" opacity="0.85">
    <path d="M452 152 H520" stroke-linecap="round"/>
    <path d="M512 145 L522 152 L512 159" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- object storage bucket -->
  <g transform="translate(534,110)">
    <path d="M6 16 H118 L108 100 H16 Z" fill="#3b4d6b" stroke="#7d8fae" stroke-width="2"/>
    <ellipse cx="62" cy="16" rx="56" ry="13" fill="#4e638a" stroke="#7d8fae" stroke-width="2"/>
    <text x="62" y="124" text-anchor="middle" font-size="14" fill="#c7d3e6">stockage objet</text>
  </g>

  <!-- event spark -->
  <g transform="translate(660,138)">
    <path d="M16 0 L4 22 H14 L2 44 L26 18 H15 L26 0 Z" fill="#ffd166"/>
  </g>

  <!-- serverless function -->
  <g transform="translate(700,104)">
    <rect x="0" y="20" width="126" height="80" rx="10" fill="url(#lambdabox)"/>
    <text x="63" y="56" text-anchor="middle" font-size="26" fill="#ffffff">ƒ</text>
    <text x="63" y="80" text-anchor="middle" font-size="13" fill="#dff3e7">sans serveur</text>
    <text x="63" y="118" text-anchor="middle" font-size="14" fill="#c7d3e6">traite en mémoire</text>
  </g>

  <!-- arrow function -> cloud folder -->
  <g stroke="#5ec2ff" stroke-width="3" fill="none" opacity="0.85">
    <path d="M834 152 H886" stroke-linecap="round"/>
    <path d="M878 145 L888 152 L878 159" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- cloud + folder -->
  <g transform="translate(892,118)">
    <path d="M22 44 a20 20 0 0 1 4 -39 a26 26 0 0 1 48 6 a17 17 0 0 1 -4 33 Z" fill="#8fa5c6" opacity="0.9"/>
    <rect x="20" y="44" width="60" height="38" rx="5" fill="#ffd166"/>
    <rect x="20" y="38" width="26" height="9" rx="3" fill="#ffd166"/>
    <text x="50" y="102" text-anchor="middle" font-size="14" fill="#c7d3e6">dossier</text>
  </g>
</svg>
