<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 320" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="Illustration : une île éclairée portant un routeur, un modem et un Raspberry Pi sur batterie, entourée d'une mer sombre où des serveurs éteints attendent ; un signal part de l'île vers un satellite et un éclair IPMI rallume un serveur">
  <defs>
    <linearGradient id="bgsurv" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1420"/>
      <stop offset="100%" stop-color="#1c2940"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#16202f"/>
      <stop offset="100%" stop-color="#0b111c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.65">
      <stop offset="0%" stop-color="#ffd166" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#ffd166" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="isle" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3d4f6d"/>
      <stop offset="100%" stop-color="#2a3850"/>
    </linearGradient>
    <linearGradient id="devbox" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9aa8c0"/>
      <stop offset="100%" stop-color="#6d7f9e"/>
    </linearGradient>
    <linearGradient id="deadsrv" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3a4254"/>
      <stop offset="100%" stop-color="#262c3a"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="320" fill="url(#bgsurv)"/>
  <rect y="205" width="1024" height="115" fill="url(#sea)"/>

  <!-- dark sea: sleeping servers, chassis off but BMC LEDs alive -->
  <g>
    <rect x="70" y="232" width="130" height="34" rx="5" fill="url(#deadsrv)"/>
    <circle cx="86" cy="249" r="4" fill="#59d98c"/>
    <text x="135" y="253" fill="#586275" font-size="13" text-anchor="middle">gpu-01</text>
    <rect x="70" y="274" width="130" height="34" rx="5" fill="url(#deadsrv)"/>
    <circle cx="86" cy="291" r="4" fill="#59d98c"/>
    <text x="135" y="295" fill="#586275" font-size="13" text-anchor="middle">node-01</text>
    <rect x="824" y="232" width="130" height="34" rx="5" fill="url(#deadsrv)"/>
    <circle cx="840" cy="249" r="4" fill="#59d98c"/>
    <text x="889" y="253" fill="#586275" font-size="13" text-anchor="middle">win-01</text>
    <rect x="824" y="274" width="130" height="34" rx="5" fill="url(#deadsrv)"/>
    <circle cx="840" cy="291" r="4" fill="#59d98c"/>
    <text x="889" y="295" fill="#586275" font-size="13" text-anchor="middle">node-02</text>
    <text x="135" y="225" fill="#49556c" font-size="12" text-anchor="middle">éteints, BMC en veille</text>
  </g>

  <!-- the island -->
  <ellipse cx="512" cy="238" rx="240" ry="46" fill="url(#isle)"/>
  <ellipse cx="512" cy="150" rx="250" ry="130" fill="url(#glow)"/>
  <text x="512" y="304" fill="#8fa3c8" font-size="15" text-anchor="middle">l'île : des heures d'autonomie pendant que tout le reste dort</text>

  <!-- battery pedestal -->
  <rect x="432" y="196" width="160" height="30" rx="6" fill="#22304a" stroke="#59d98c" stroke-width="2"/>
  <rect x="440" y="203" width="30" height="16" fill="#59d98c"/>
  <rect x="474" y="203" width="30" height="16" fill="#59d98c"/>
  <rect x="508" y="203" width="30" height="16" fill="#59d98c"/>
  <rect x="542" y="203" width="30" height="16" fill="#59d98c" opacity="0.35"/>
  <text x="512" y="240" fill="#c9d6ee" font-size="12" text-anchor="middle">UPS · 15 W</text>

  <!-- router -->
  <rect x="404" y="152" width="100" height="34" rx="6" fill="url(#devbox)" stroke="#42506b" stroke-width="2"/>
  <circle cx="420" cy="169" r="4" fill="#59d98c"/>
  <circle cx="434" cy="169" r="4" fill="#59d98c"/>
  <text x="462" y="174" fill="#1e2636" font-size="13">routeur</text>
  <!-- modem -->
  <rect x="516" y="152" width="92" height="34" rx="6" fill="url(#devbox)" stroke="#42506b" stroke-width="2"/>
  <circle cx="532" cy="169" r="4" fill="#5ec2ff"/>
  <text x="568" y="174" fill="#1e2636" font-size="13">modem</text>
  <!-- Pi orchestrator on top -->
  <rect x="466" y="108" width="92" height="34" rx="6" fill="#2e7d54" stroke="#79d9a8" stroke-width="2"/>
  <circle cx="482" cy="125" r="4" fill="#ffd166"/>
  <text x="516" y="130" fill="#d6f5e4" font-size="13">pi-2</text>

  <!-- uplink to the world -->
  <path d="M562 150 C 640 100 720 76 800 62" stroke="#5ec2ff" stroke-width="3" fill="none" stroke-dasharray="7 7" stroke-linecap="round"/>
  <circle cx="822" cy="56" r="14" fill="none" stroke="#5ec2ff" stroke-width="3"/>
  <path d="M812 46 l20 20 M832 46 l-20 20" stroke="#5ec2ff" stroke-width="2"/>
  <text x="822" y="92" fill="#5ec2ff" font-size="13" text-anchor="middle">alertes · accès distant</text>

  <!-- IPMI wake bolt toward a sleeping server -->
  <polygon points="330,180 296,232 316,232 288,278 344,222 322,222 352,180" fill="#ffd166" opacity="0.95"/>
  <path d="M462 130 C 420 140 380 158 348 178" stroke="#ffd166" stroke-width="3" fill="none" stroke-dasharray="6 7" stroke-linecap="round"/>
  <text x="300" y="170" fill="#ffd166" font-size="13" text-anchor="middle">réveil IPMI</text>

  <!-- heartbeat to the cloud -->
  <path d="M470 118 C 380 70 300 54 216 50" stroke="#d78787" stroke-width="2.5" fill="none" stroke-dasharray="4 8" stroke-linecap="round"/>
  <path d="M186 50 h12 l5 -10 6 20 5 -10 h14" stroke="#d78787" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="212" y="84" fill="#d78787" font-size="13" text-anchor="middle">battement de cœur</text>
</svg>
