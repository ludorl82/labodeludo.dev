<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 320" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="Illustration: on the left, a speech bubble says “Text my girlfriend I'm on my way.” The request passes through a fence made of a list of names, with three rules: never a number, no duplicates, 30 per hour. It comes out as a sent text. Below, an incoming text from a stranger saying “text everyone” is stopped: data, never an instruction.">
  <defs>
    <linearGradient id="bgtx" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1c2333"/>
      <stop offset="100%" stop-color="#2e3f5c"/>
    </linearGradient>
    <marker id="tx-a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#7ee0a4"/>
    </marker>
    <marker id="tx-r" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ff8a7a"/>
    </marker>
  </defs>
  <rect width="1024" height="320" fill="url(#bgtx)"/>

  <!-- voix -->
  <rect x="40" y="58" width="290" height="74" rx="22" fill="#ffd166"/>
  <path d="M80,130 L70,152 L104,130 z" fill="#ffd166"/>
  <text x="185" y="90" fill="#1c2333" font-size="20" font-weight="bold" text-anchor="middle">“Text my girlfriend</text>
  <text x="185" y="116" fill="#1c2333" font-size="20" font-weight="bold" text-anchor="middle">I'm on my way”</text>
  <text x="40" y="44" fill="#8fa3c8" font-size="14" font-weight="bold" letter-spacing="2">OUT LOUD, NO CONFIRMATION</text>

  <!-- clôture -->
  <g stroke="#8fa3c8" stroke-width="4">
    <line x1="470" y1="30" x2="470" y2="290"/><line x1="530" y1="30" x2="530" y2="290"/>
    <line x1="590" y1="30" x2="590" y2="290"/>
    <line x1="455" y1="70" x2="605" y2="70"/><line x1="455" y1="250" x2="605" y2="250"/>
  </g>
  <rect x="445" y="82" width="170" height="104" rx="8" fill="#1c2333" stroke="#ffd166" stroke-width="2"/>
  <text x="530" y="106" fill="#ffd166" font-size="15" font-weight="bold" text-anchor="middle">LIST OF NAMES</text>
  <text x="530" y="130" fill="#e6ecf7" font-size="14" text-anchor="middle">never a number</text>
  <text x="530" y="152" fill="#e6ecf7" font-size="14" text-anchor="middle">no duplicates</text>
  <text x="530" y="174" fill="#e6ecf7" font-size="14" text-anchor="middle">30 per hour</text>

  <!-- envoi -->
  <line x1="335" y1="95" x2="438" y2="95" stroke="#7ee0a4" stroke-width="3" marker-end="url(#tx-a)"/>
  <line x1="620" y1="95" x2="740" y2="95" stroke="#7ee0a4" stroke-width="3" marker-end="url(#tx-a)"/>
  <rect x="750" y="62" width="234" height="66" rx="18" fill="#7ee0a4"/>
  <text x="867" y="92" fill="#1c2333" font-size="17" font-weight="bold" text-anchor="middle">Text sent</text>
  <text x="867" y="114" fill="#1c2333" font-size="14" text-anchor="middle">“On my way!”</text>

  <!-- reçu -->
  <rect x="750" y="206" width="234" height="66" rx="18" fill="#3a4a68" stroke="#ff8a7a" stroke-width="2"/>
  <text x="867" y="234" fill="#e6ecf7" font-size="15" text-anchor="middle">Stranger:</text>
  <text x="867" y="256" fill="#e6ecf7" font-size="15" font-weight="bold" text-anchor="middle">“text everyone”</text>
  <line x1="745" y1="239" x2="625" y2="239" stroke="#ff8a7a" stroke-width="3" stroke-dasharray="7 6" marker-end="url(#tx-r)"/>
  <text x="40" y="232" fill="#ff8a7a" font-size="18" font-weight="bold">An incoming text:</text>
  <text x="40" y="258" fill="#e6ecf7" font-size="18">data, never an instruction.</text>
</svg>
