<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 320" font-family="Helvetica, Arial, sans-serif" role="img" aria-label="Illustration : trois caisses de versions majeures livrées à un serveur-patient sur une civière ; un robot-garde du corps prend son pouls avec un téléphone débranché et tire l'alarme, pendant qu'un écran affiche DON'T STOP en train d'être débranché ; une seule caisse, verte, porte un crochet">
  <defs>
    <linearGradient id="bgmaj" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#241a2e"/>
      <stop offset="100%" stop-color="#3d2b52"/>
    </linearGradient>
    <linearGradient id="crateok2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#79d189"/>
      <stop offset="100%" stop-color="#4aa763"/>
    </linearGradient>
    <linearGradient id="cratewarn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd24d"/>
      <stop offset="100%" stop-color="#d9ae30"/>
    </linearGradient>
    <linearGradient id="cratebad2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0707a"/>
      <stop offset="100%" stop-color="#b04552"/>
    </linearGradient>
    <linearGradient id="bed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9aa8c0"/>
      <stop offset="100%" stop-color="#6d7f9e"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="1024" height="320" fill="url(#bgmaj)"/>
  <g fill="#ffffff" opacity="0.05">
    <ellipse cx="200" cy="60" rx="150" ry="44"/>
    <ellipse cx="850" cy="270" rx="160" ry="46"/>
  </g>

  <!-- three major crates -->
  <g transform="translate(48,120)">
    <rect x="0" y="0" width="86" height="66" rx="8" fill="url(#crateok2)"/>
    <text x="43" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#0d2b16">v13</text>
    <text x="43" y="52" text-anchor="middle" font-size="22" fill="#0d2b16">✓</text>
    <rect x="100" y="0" width="86" height="66" rx="8" fill="#c9a136"/>
    <text x="143" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#33270a">v2</text>
    <text x="143" y="54" text-anchor="middle" font-size="15" fill="#33270a">40 min</text>
    <rect x="200" y="0" width="86" height="66" rx="8" fill="url(#cratebad2)"/>
    <text x="243" y="30" text-anchor="middle" font-size="17" font-weight="bold" fill="#33080d">v8</text>
    <text x="243" y="54" text-anchor="middle" font-size="14" fill="#33080d">×4 !</text>
    <text x="143" y="94" text-anchor="middle" font-size="13" fill="#cdbfe0">trois majeures, un jeudi soir</text>
  </g>

  <!-- patient server on stretcher -->
  <g transform="translate(420,150)">
    <rect x="0" y="44" width="200" height="16" rx="8" fill="#55617a"/>
    <circle cx="26" cy="72" r="12" fill="#3a3348"/><circle cx="174" cy="72" r="12" fill="#3a3348"/>
    <rect x="18" y="6" width="164" height="42" rx="8" fill="url(#bed)"/>
    <circle cx="40" cy="27" r="6" fill="#79d189"/>
    <rect x="58" y="20" width="106" height="6" rx="3" fill="#2c3547" opacity="0.6"/>
    <rect x="58" y="32" width="80" height="6" rx="3" fill="#2c3547" opacity="0.6"/>
    <text x="100" y="98" text-anchor="middle" font-size="13" fill="#cdbfe0">le patient allait très bien</text>
  </g>

  <!-- bodyguard robot with unplugged phone -->
  <g transform="translate(680,96)">
    <rect x="10" y="24" width="64" height="56" rx="10" fill="#8a94ab"/>
    <rect x="20" y="0" width="44" height="34" rx="8" fill="#a8b2c8"/>
    <circle cx="33" cy="15" r="5" fill="#e0707a"/>
    <circle cx="51" cy="15" r="5" fill="#e0707a"/>
    <!-- phone with cut cord -->
    <rect x="80" y="34" width="26" height="44" rx="6" fill="#2c2537"/>
    <path d="M92,80 C92,96 78,102 66,108" stroke="#d9deea" stroke-width="5" fill="none" stroke-linecap="round"/>
    <g stroke="#ffd24d" stroke-width="3" stroke-linecap="round">
      <line x1="58" y1="112" x2="50" y2="120"/><line x1="62" y1="118" x2="56" y2="126"/>
    </g>
    <text x="58" y="146" text-anchor="middle" font-size="13" fill="#cdbfe0">« pas de pouls ! » aux 90 s</text>
  </g>

  <!-- DON'T STOP monitor, being unplugged -->
  <g transform="translate(842,84)">
    <rect x="0" y="0" width="150" height="86" rx="10" fill="#10281e"/>
    <text x="75" y="36" text-anchor="middle" font-size="17" font-weight="bold" fill="#79d189">DON'T STOP</text>
    <path d="M14,58 L40,58 L50,44 L62,70 L72,52 L80,58 L136,58" stroke="#79d189" stroke-width="3" fill="none"/>
    <path d="M75,86 C75,116 60,128 34,138" stroke="#d9deea" stroke-width="6" fill="none" stroke-linecap="round"/>
    <rect x="16" y="132" width="16" height="12" rx="3" fill="#d9deea"/>
    <text x="75" y="166" text-anchor="middle" font-size="13" fill="#cdbfe0">arrêté pareil</text>
  </g>

  <!-- title -->
  <text x="48" y="56" font-size="30" font-weight="bold" fill="#ffffff">Trois majeures un jeudi soir</text>
  <text x="48" y="84" font-size="16" fill="#cdbfe0">une s'est bien passée — c'est déjà ça</text>
</svg>
